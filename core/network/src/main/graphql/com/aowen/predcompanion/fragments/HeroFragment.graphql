fragment HeroFragment on Hero {
    id
    name
    generalStatistic {
        result {
            matchesPlayed
            matchesWon
        }
    }
    data {
        displayName
        defaultSkin {
            portrait
            smallPortrait
        }
        icon
        classes
        roles
        mainAttributes {
            abilityPower
            attackPower
            durability
            mobility
        }
        abilities {
            key
            displayName
            icon
            gameDescription
            menuDescription
            cooldown
            cost
        }
        attributes {
            stat
            values
        }
    }

}